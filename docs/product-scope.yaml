  - "기본 문장 조립"
  - "이유·예시·감정 확장"
  - "시간 제한 재인출"
  - "새 질문 전이"
  - "과정 피드백"
non_goals:
  - "로그인과 서버"
  - "AI와 음성"
  - "공식 등급 예측"
  - "배포"

