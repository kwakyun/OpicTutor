version: 1
product: "OPIc Speech Quest"
problem: "필요한 영어 표현을 즉시 떠올리지 못해 문장을 시작하고 확장하기 어렵다."
target_behavior: "의도에 맞는 표현을 인출해 자기 정보로 문장을 만들고 새 질문에 전이한다."
