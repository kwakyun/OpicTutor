version: 2
process:
  id: "product_scope"
  execution_status: "completed"
  name: "핵심 문제와 로컬 MVP 경계 확정"
  owner_role: "product_engineering"

objective: >-
  사용자가 영어 표현을 바로 떠올리지 못해 문장을 만들지 못하는 문제에 집중하고,
  구현할 핵심 흐름과 구현하지 않을 기능을 명확히 고정한다.

scope:
  owns:
    - "사용자 문제와 학습 목표"
    - "핵심 사용자 흐름"
    - "MVP 포함·제외 범위"
    - "제품 성공 조건"
  does_not_own:
    - "프레임워크와 디렉터리 구조"
    - "콘텐츠 스키마 세부사항"
    - "학습 알고리즘 구현"
    - "UI 컴포넌트 구현"
    - "테스트 코드"

primary_user_problem:
  symptom: "말하고 싶은 내용은 있지만 필요한 영어 표현이 즉시 떠오르지 않는다."
  consequence: "첫 문장 시작이 느리고, 단문에서 이유·예시·감정으로 확장하지 못한다."
  target_behavior: "의도에 맞는 표현을 인출하고 자신의 정보와 결합해 새 문장을 만든다."

core_loop:
  - "질문과 한국어 의도 cue 확인"
  - "영어 표현을 기억에서 인출"
  - "기본 문장 직접 작성"
  - "이유·예시·감정·디테일로 확장"
  - "힌트 없이 제한 시간 재작성"
  - "새 질문에 동일 표현 기능 전이"
  - "과정 중심 피드백과 복습 큐 반영"

mvp_features:
  - "core 질문 팩"
  - "기능별 표현 청크"
  - "점진적 힌트"
  - "문장 조립과 확장 미션"
  - "시간 제한 재인출"
  - "새 질문 전이"
  - "인출 시간·힌트 의존·구조·전이 피드백"
  - "로컬 연습 기록과 숙련도"
  - "로컬 데이터 내보내기·가져오기·초기화"
  - "브라우저 내장 영어 음성 받아쓰기와 타이핑 폴백"

non_goals:
  - "로그인·회원가입·계정"
  - "백엔드·데이터베이스·클라우드 동기화"
  - "AI 첨삭과 외부 LLM API"
  - "발음·억양 평가와 음성 녹음 파일 업로드·보관"
  - "결제·랭킹·친구·소셜·관리자"
  - "원격 콘텐츠 마켓플레이스"
  - "호스팅·도메인·CI/CD·운영 모니터링"
  - "공식 OPIc 등급 예측 또는 AL 보장"

success_signals:
  - "첫 시도에 완전한 문장을 만든다."
  - "전체 예시 힌트 없이 표현을 사용한다."
  - "기본 문장에 요구된 확장 요소를 붙인다."
  - "새 질문에서 같은 표현 기능을 다시 사용한다."
  - "새로고침 후 진행 상태를 복구한다."

artifacts:
  - "docs/product-scope.yaml"
  - "docs/core-user-flow.yaml"

exit_gate:
  - "모든 기능이 core_loop 또는 non_goals 중 하나에 배타적으로 분류된다."
  - "AL은 방향성 목표이고 서비스 결과 보장이 아님이 명시된다."
  - "계정·서버·배포 없이 성공 조건을 측정할 수 있다."

agent_prompt: |-
  당신은 제품 범위 담당자다.
  사용자가 영어 표현을 바로 떠올려 직접 문장을 구성하는 능력 향상에만 초점을 맞춰라.
  핵심 흐름을 질문→표현 인출→문장 조립→확장→시간 제한 재인출→새 질문 전이→피드백으로 고정하라.
  타이핑과 브라우저 내장 음성 받아쓰기를 동일한 답변 입력으로 지원하라.
  로그인, 백엔드, AI, 발음 평가, 음성 업로드, 결제, 랭킹, 소셜, 관리자, 원격 팩, 배포는 non-goal로 명시하라.
  프레임워크나 구현 세부사항을 결정하지 말고 제품 경계와 측정 가능한 성공 조건만 YAML로 작성하라.
