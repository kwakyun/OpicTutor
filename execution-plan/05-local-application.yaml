version: 2
process:
  id: "local_application"
  execution_status: "completed"
  name: "로컬 UI·저장소·학습 엔진 통합"
  owner_role: "frontend_product_engineering"

objective: >-
  검증된 콘텐츠와 순수 학습 엔진을 React UI 및 versioned LocalStorage에 연결해
  계정 없이 전체 핵심 흐름을 사용할 수 있는 로컬 애플리케이션을 만든다.

scope:
  owns:
    - "route와 화면 조립"
    - "practice UI와 접근성"
    - "LocalStorage repository와 migration"
    - "콘텐츠 loader와 domain engine 통합"
    - "타이핑·브라우저 음성 받아쓰기 입력 어댑터"
    - "내보내기·가져오기·초기화"
  does_not_own:
    - "도메인 규칙 재구현"
    - "콘텐츠 원문 편집"
    - "서버·계정·배포"

routes:
  - path: "/"
    feature: "home"
    purpose: "추천 연습과 현재 복습 큐"
  - path: "/practice/:questionId"
    feature: "practice"
    purpose: "핵심 state machine UI"
  - path: "/expressions"
    feature: "expressions"
    purpose: "기능별 표현 탐색과 연습 시작"
  - path: "/history"
    feature: "history"
    purpose: "로컬 attempt와 재도전"
  - path: "/settings"
    feature: "settings"
    purpose: "내보내기·가져오기·초기화"

practice_ui_contract:
  - "현재 state에서 필요한 입력과 단일 주요 행동만 강조한다."
  - "사용자 제출 전 model answer와 전체 예시를 DOM에 렌더링하지 않는다."
  - "힌트 사용 전 단계와 사용 결과를 명확히 표시한다."
  - "타이머는 시각 정보와 접근 가능한 텍스트를 함께 제공한다."
  - "단계 이동 시 제목으로 focus를 이동한다."
  - "모든 동작은 키보드만으로 완료할 수 있다."
  - "중간 draft는 입력 변화 후 제한적으로 저장하고 unload에 의존하지 않는다."
  - "모든 답변 단계에서 타이핑과 영어 음성 받아쓰기가 같은 텍스트 상태를 갱신한다."
  - "마이크 미지원·권한 거부·음성 미감지 시 오류를 설명하고 타이핑 경로를 유지한다."
  - "단계 전환과 컴포넌트 해제 시 활성 음성 인식을 중단한다."

storage_model:
  namespace: "opic-speech-quest"
  schema_version: 1
  records:
    - "settings"
    - "drafts"
    - "attempts"
    - "mastery"
    - "content_state"
  repository_methods:
    - "loadSnapshot"
    - "saveDraft"
    - "commitAttempt"
    - "updateMastery"
    - "exportData"
    - "importData"
    - "resetNamespace"
  safety:
    - "모든 읽기 결과를 runtime validation한다."
    - "migration은 멱등적이고 단계별로 테스트한다."
    - "손상 데이터는 원본 문자열을 백업한 뒤 복구한다."
    - "초기화는 namespace 밖의 key를 삭제하지 않는다."
    - "import는 적용 전에 전체 payload를 검증한다."

integration_flow:
  - "route에서 question ID 수신"
  - "content repository에서 validated training unit 로드"
  - "저장 draft가 있으면 content version 호환성 확인"
  - "domain machine 생성 또는 복구"
  - "UI event를 domain event로 변환"
  - "domain output을 화면에 투영"
  - "attempt 완료 시 원자적으로 attempt와 mastery 저장"

performance_budget:
  - "초기 콘텐츠 JSON은 필요한 core pack만 로드한다."
  - "입력 keystroke마다 전체 history를 직렬화하지 않는다."
  - "history는 정렬·필터 후 제한된 항목만 렌더링한다."
  - "불필요한 전역 state와 대형 UI 라이브러리를 도입하지 않는다."

artifacts:
  - "src/app/"
  - "src/features/practice/"
  - "src/features/expressions/"
  - "src/features/history/"
  - "src/features/settings/"
  - "src/storage/"
  - "tests/integration/"

exit_gate:
  - "npm run dev로 앱이 실행된다."
  - "계정과 네트워크 없이 전체 학습 흐름을 완료한다."
  - "새로고침 후 draft와 mastery가 복구된다."
  - "fixture 팩이 앱 코드 변경 없이 표시된다."
  - "지원 브라우저에서는 마이크 받아쓰기가 답변에 추가되고, 미지원 환경에서는 타이핑 안내가 표시된다."
  - "손상 데이터, 잘못된 import, 없는 질문 ID가 복구 가능한 UI로 처리된다."

agent_prompt: |-
  당신은 로컬 React 애플리케이션 구현 담당자다.
  콘텐츠 loader, 순수 domain state machine, LocalStorage repository를 명시된 경계로 통합하라.
  홈, 연습, 표현, 기록, 설정의 최소 route만 구현하고 사용자가 제출하기 전 model answer를 DOM에 넣지 마라.
  LocalStorage 직접 접근을 storage module에 제한하고 version validation, 멱등 migration, 손상 복구,
  JSON 내보내기·검증된 가져오기·namespace 한정 초기화를 구현하라.
  키보드, focus 이동, 타이머 텍스트, 오류 복구를 포함하고 로그인·서버·외부 API·배포 코드를 추가하지 마라.
