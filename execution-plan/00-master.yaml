version: 2
execution_status: "completed"
project: "opic-speech-quest"
plan_type: "local-mvp-sequential-prompts"
language: "ko"
working_directory: "C:\\WorkSpace\\Opic"

goal: >-
  로그인·백엔드·배포 없이 로컬 브라우저에서 실행되며, 사용자가 필요한 영어 표현을
  빠르게 떠올려 직접 문장을 만들고 확장한 뒤 새로운 질문에 전이하도록 훈련하는 MVP를 완성한다.

engineering_principles:
  - "Vertical slice first: 질문 하나로 전체 학습 흐름을 먼저 관통시킨 뒤 콘텐츠를 늘린다."
  - "Pure domain core: 학습 규칙과 점수·숙련 계산은 React 및 LocalStorage와 분리한다."
  - "Explicit state machine: 연습 단계를 boolean 조합이 아닌 상태와 이벤트로 관리한다."
  - "Content as data: 질문·표현·훈련 unit은 코드가 아닌 검증된 로컬 콘텐츠 팩으로 관리한다."
  - "Repository boundary: LocalStorage 직접 접근은 storage adapter 안으로 제한한다."
  - "Runtime validation: 외부 경계의 콘텐츠와 저장 데이터는 스키마로 검증한다."
  - "Local first: 설치 후 핵심 학습 흐름은 네트워크와 API key 없이 작동한다."
  - "YAGNI: 로그인·백엔드·AI·음성 업로드·발음 평가·결제·랭킹·배포 기능을 구현하지 않는다."
  - "Input adapter: 타이핑과 브라우저 내장 음성 인식을 같은 텍스트 답변 상태로 수렴시킨다."

processes:
  - order: 1
    id: "product_scope"
    file: "01-product-scope.yaml"
    depends_on: []
  - order: 2
    id: "engineering_foundation"
    file: "02-engineering-foundation.yaml"
    depends_on: ["product_scope"]
  - order: 3
    id: "content_system"
    file: "03-content-system.yaml"
    depends_on: ["product_scope", "engineering_foundation"]
  - order: 4
    id: "learning_engine"
    file: "04-learning-engine.yaml"
    depends_on: ["content_system"]
  - order: 5
    id: "local_application"
    file: "05-local-application.yaml"
    depends_on: ["learning_engine"]
  - order: 6
    id: "quality_gate"
    file: "06-quality-gate.yaml"
    depends_on: ["local_application"]

execution_rules:
  - "각 파일의 agent_prompt를 순서대로 실행한다."
  - "선행 프로세스의 exit_gate가 통과하지 않으면 다음 프로세스를 시작하지 않는다."
  - "각 프로세스는 자신의 scope만 변경하고 다른 프로세스의 책임을 끌어오지 않는다."
  - "필요한 판단은 ADR로 기록하고 암묵적인 구조 변경을 금지한다."
  - "기존 테스트가 실패한 상태로 다음 단계에 진입하지 않는다."

required_commands:
  - "npm run dev"
  - "npm run check"
  - "npm run test"
  - "npm run test:e2e"
  - "npm run content:validate"

definition_of_done:
  - "npm run dev로 계정 없이 앱을 실행한다."
  - "질문 선택→표현 인출→문장 조립→확장→재인출→전이→피드백을 완료한다."
  - "모델 답변은 사용자의 직접 산출 전에는 노출되지 않는다."
  - "질문·표현·훈련 unit은 로컬 콘텐츠 팩에서 동적으로 로드된다."
  - "진행 상태와 숙련도가 versioned LocalStorage에 저장·복구된다."
  - "핵심 도메인 규칙, 저장소 migration, 콘텐츠 계약, 전체 흐름 테스트가 통과한다."
  - "로그인·백엔드·앱 전용 외부 API·배포 설정이 없다."
  - "지원 브라우저에서는 마이크로 영어 답변을 받아 적고, 미지원·권한 거부 시 타이핑으로 계속한다."
completion_report: "reports/local-mvp-validation.yaml"
