model_answers:
  - {question_id: q-home-description, review_status: approved, text: "Actually, I would say that my home is small but comfortable. I especially like it when sunlight comes into my room in the morning. It makes me feel calm and ready for the day. That's why my room is my favorite place at home."}
  - {question_id: q-weekend-habit, review_status: approved, text: "Actually, I usually stay home or take a long walk on weekends. The main reason is that I need time to recharge. For example, last Sunday, I walked around a nearby park for an hour. It made me feel refreshed."}
  - {question_id: q-travel-memory, review_status: approved, text: "At first, I was nervous about traveling alone, but the trip became one of my best memories. I especially remember watching the sunset by the ocean. It made me feel free and proud of myself. That's why the trip still means a lot to me."}
  - {question_id: q-neighborhood-change, review_status: approved, text: "My neighborhood used to be quiet, but now it is much busier. There are more cafes and stores, especially near the subway station. The change makes the area more convenient, although I sometimes miss the quiet streets."}
  - {question_id: q-travel-problem, review_status: approved, text: "At first, everything went well. The problem was that I missed the last train to my hotel. What I mean is, there was no public transportation left, so I called a taxi and shared it with another traveler. That's why I now check the final train time in advance."}
  - {question_id: q-hotel-roleplay, review_status: approved, text: "Hello, I'm calling because I'd like to book a room for this weekend. Could you tell me the price and whether breakfast is included? What I mean is, is breakfast part of the room rate? Also, what time can I check in? Thank you for your help."}
  - {question_id: q-movie-preference, review_status: approved, text: "Actually, I really enjoy thrillers. The main reason is that they keep me focused on the story. For example, last weekend, I watched one at home and kept guessing what would happen next. That's why thrillers are my favorite."}
  - {question_id: q-cafe-description, review_status: approved, text: "Actually, I often visit a small cafe near my office. It has warm lighting and quiet music. I especially like it when the window seat is available. It makes me feel relaxed, so I often go there after work."}
  - {question_id: q-exercise-habit, review_status: approved, text: "Actually, I usually go for a walk in the evening. The main reason is that walking helps me clear my head. For example, yesterday I walked along the river after work. It made me feel much better."}
  - {question_id: q-tech-change, review_status: approved, text: "I used to watch scheduled TV shows, but now I stream videos whenever I want. For example, I often watch short documentaries on my phone during breaks. The convenience makes me feel more in control of my free time."}
  - {question_id: q-first-job-memory, review_status: approved, text: "At first, I felt nervous because I did not know anyone. The problem was that I forgot several coworkers' names. I asked them again and wrote the names down during lunch. It made me feel more comfortable, and the afternoon went much better."}
  - {question_id: q-cafe-roleplay, review_status: approved, text: "Excuse me, the problem is that I ordered tea, but I received coffee. What I mean is, I think this drink belongs to another customer. Could you replace it with the tea I ordered? Thank you."}
